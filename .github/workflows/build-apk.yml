name: Build Android APK

# این اکشن با هر بار Push در شاخه main یا به صورت دستی اجرا می‌شود
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        # مسیر زیر به صورت پیش‌فرض برای پروژه‌های اندروید است. 
        # اگر نام ماژول شما چیزی غیر از app است، این مسیر را تغییر دهید.
        path: app/build/outputs/apk/debug/*.apk
